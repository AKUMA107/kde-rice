background_opacity 0.8
window_background_opacity 0.5
# Edgerunners Cyberpunk Terminal
# ------------------------------

confirm_os_window_close 0  

### Window Settings
initial_window_width  2000
initial_window_height 1200
remember_window_size yes
hide_window_decorations titlebar-only
window_padding_width 5 5


### Cursor Settings
cursor_shape beam
cursor_blink_interval 500


### Font & Text
font_family      JetBrains Mono Bold
bold_font        auto
italic_font      auto
font_size        11
disable_ligatures never

### Cyberpunk Color Scheme
foreground       #e0e0e0
background       #0a0a0a
cursor           #ff0033

# Black/White/Red palette
color0  #0a0a0a
color8  #4a4a4a
color1  #ff0033
color9  #ff3355
color7  #e0e0e0
color15 #ffffff

### Tab Bar (Edgerunners Style)
tab_bar_style powerline
tab_powerline_style angled
active_tab_foreground   #ffffff
active_tab_background   #ff0033
inactive_tab_foreground #aaaaaa
inactive_tab_background #333333

### Launch fastfetch on startup
shell_integration enabled
shell /usr/bin/bash -c 'fastfetch; exec bash'
